name = "shift-plan"
main = "src/index.js"
compatibility_date = "2025-01-01"

# The calendar page is copied into ./public by deploy.ps1 (it is not committed).
# run_worker_first makes every request, including the page itself, go through the sign-in check.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Role changes made in the app are stored here. Wrangler creates the store on the first deploy.
[[kv_namespaces]]
binding = "ROLES"

# The shared team plan lives in a Durable Object (SQLite-backed, available on the free plan).
[[durable_objects.bindings]]
name = "PLAN"
class_name = "PlanStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PlanStore"]
